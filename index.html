<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI-Sprint</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        /* Remove margens e garante que o corpo ocupe tudo */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #05070a; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* O Canvas agora se ajusta à largura ou altura disponível */
        canvas { 
            display: block;
            background: #000;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
            cursor: pointer; /* Indica que é clicável para Fullscreen */
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
